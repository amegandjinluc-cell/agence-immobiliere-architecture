<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Tableau de bord</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-50">
  <nav class="bg-gray-900 text-white px-4 py-3 flex justify-between items-center">
    <span class="font-bold">🏠 Admin</span>
    <div class="flex items-center gap-4">
      <span id="adminEmail" class="text-sm text-gray-400"></span>
      <button onclick="logout()" class="text-sm bg-red-600 hover:bg-red-700 px-3 py-1 rounded">Déconnexion</button>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">Gestion des biens</h1>
      <a href="add-bien.html" class="bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-emerald-800">+ Ajouter un bien</a>
    </div>

    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-100 text-gray-600">
          <tr>
            <th class="px-4 py-3 text-left">Photo</th>
            <th class="px-4 py-3 text-left">Titre</th>
            <th class="px-4 py-3 text-left">Type</th>
            <th class="px-4 py-3 text-left">Prix</th>
            <th class="px-4 py-3 text-left">Statut</th>
            <th class="px-4 py-3 text-left">Localité</th>
            <th class="px-4 py-3 text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="biensTable"></tbody>
      </table>
      <div id="emptyMsg" class="hidden text-center text-gray-400 py-12">Aucun bien publié.</div>
    </div>
  </main>

  <script src="../../js/api.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) { window.location.href = 'index.html'; }

    document.getElementById('adminEmail').textContent = localStorage.getItem('adminEmail') || '';

    async function loadBiens() {
      const res = await fetch(API_BASE + '/api/biens', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (res.status === 401) { window.location.href = 'index.html'; return; }
      const biens = await res.json();
      const tbody = document.getElementById('biensTable');
      const empty = document.getElementById('emptyMsg');

      if (biens.length === 0) { tbody.classList.add('hidden'); empty.classList.remove('hidden'); return; }
      empty.classList.add('hidden'); tbody.classList.remove('hidden');

      tbody.innerHTML = biens.map(b => `
        <tr class="border-t hover:bg-gray-50">
          <td class="px-4 py-3">
            ${b.photos && b.photos.length ? `<img src="${API_BASE}${b.photos[0].url}" class="h-10 w-10 object-cover rounded" />` : '📷'}
          </td>
          <td class="px-4 py-3 font-medium">${b.titre}</td>
          <td class="px-4 py-3">${b.type}</td>
          <td class="px-4 py-3">${b.prix.toLocaleString()} ${b.devise}</td>
          <td class="px-4 py-3"><span class="text-xs px-2 py-1 rounded ${b.statut === 'Disponible' ? 'bg-green-100 text-green-800' : b.statut === 'Loué' ? 'bg-blue-100 text-blue-800' : 'bg-gray-100 text-gray-800'}">${b.statut}</span></td>
          <td class="px-4 py-3">${b.localite}</td>
          <td class="px-4 py-3 text-right space-x-2">
            <a href="edit-bien.html?id=${b.id}" class="text-emerald-700 hover:underline text-xs">Modifier</a>
            <button onclick="supprimer(${b.id})" class="text-red-600 hover:underline text-xs">Supprimer</button>
          </td>
        </tr>
      `).join('');
    }

    async function supprimer(id) {
      if (!confirm('Supprimer ce bien ?')) return;
      await fetch(API_BASE + '/api/biens/' + id, {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      loadBiens();
    }

    function logout() {
      localStorage.removeItem('token');
      window.location.href = 'index.html';
    }

    loadBiens();
  </script>
</body>
</html>
