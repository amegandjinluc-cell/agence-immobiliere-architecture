<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Modifier un bien</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-50">
  <nav class="bg-gray-900 text-white px-4 py-3 flex justify-between items-center">
    <span class="font-bold">🏠 Admin</span>
    <a href="dashboard.html" class="text-sm text-gray-400 hover:text-white">← Retour</a>
  </nav>

  <main class="max-w-3xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold mb-6">Modifier le bien</h1>
    <form id="bienForm" class="bg-white rounded-xl shadow-sm p-6 space-y-4" enctype="multipart/form-data">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Type *</label>
          <select name="type" required class="w-full border rounded-lg px-3 py-2 text-sm">
            <option>Maison</option><option>Appartement</option><option>Immeuble</option><option>Terrain</option><option>Bureau</option><option>Autre</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Titre *</label>
          <input name="titre" required class="w-full border rounded-lg px-3 py-2 text-sm" />
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <textarea name="description" rows="3" class="w-full border rounded-lg px-3 py-2 text-sm"></textarea>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Prix *</label><input type="number" name="prix" required class="w-full border rounded-lg px-3 py-2 text-sm" /></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Devise</label><select name="devise" class="w-full border rounded-lg px-3 py-2 text-sm"><option>FCFA</option><option>USD</option><option>EUR</option></select></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Statut</label><select name="statut" class="w-full border rounded-lg px-3 py-2 text-sm"><option>Disponible</option><option>Loué</option><option>Vendu</option></select></div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Localité *</label><input name="localite" required class="w-full border rounded-lg px-3 py-2 text-sm" /></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Quartier</label><input name="quartier" class="w-full border rounded-lg px-3 py-2 text-sm" /></div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Pièces</label><input type="number" name="pieces" class="w-full border rounded-lg px-3 py-2 text-sm" /></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Superficie (m²)</label><input type="number" step="0.01" name="superficie" class="w-full border rounded-lg px-3 py-2 text-sm" /></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-1">Équipements</label><input name="equipements" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Clim, Parking…" /></div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nouvelles photos (optionnel)</label>
        <input type="file" name="photos" multiple accept="image/*" class="w-full border rounded-lg px-3 py-2 text-sm" />
      </div>
      <div id="msg" class="hidden text-sm rounded-lg px-3 py-2"></div>
      <button type="submit" class="w-full bg-emerald-700 text-white font-semibold py-2 rounded-lg hover:bg-emerald-800 transition">Sauvegarder</button>
    </form>
  </main>

  <script src="../../js/api.js"></script>
  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = 'index.html';

    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');

    async function loadBien() {
      const b = await fetchBien(id);
      const f = document.getElementById('bienForm');
      f.titre.value = b.titre;
      f.description.value = b.description || '';
      f.prix.value = b.prix;
      f.devise.value = b.devise || 'FCFA';
      f.localite.value = b.localite;
      f.quartier.value = b.quartier || '';
      f.pieces.value = b.pieces || '';
      f.superficie.value = b.superficie_m2 || '';
      f.equipements.value = b.equipements || '';
      f.type.value = b.type;
      f.statut.value = b.statut;
    }

    document.getElementById('bienForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.classList.add('hidden');
      const formData = new FormData(e.target);

      const res = await fetch(API_BASE + '/api/biens/' + id, {
        method: 'PUT',
        headers: { 'Authorization': 'Bearer ' + token },
        body: formData
      });
      const data = await res.json();
      msg.className = res.ok ? 'text-sm rounded-lg px-3 py-2 bg-green-100 text-green-800' : 'text-sm rounded-lg px-3 py-2 bg-red-100 text-red-800';
      msg.textContent = res.ok ? '✅ Bien mis à jour !' : (data.error || 'Erreur');
      msg.classList.remove('hidden');
    });

    loadBien();
  </script>
</body>
</html>
