<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Connexion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md">
    <h1 class="text-2xl font-bold text-gray-900 mb-2">🔐 Espace Administrateur</h1>
    <p class="text-sm text-gray-500 mb-6">Connectez-vous pour gérer vos biens</p>
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input id="email" type="email" required class="w-full border rounded-lg px-4 py-2 text-sm" placeholder="admin@immobilier.tg" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
        <input id="password" type="password" required class="w-full border rounded-lg px-4 py-2 text-sm" placeholder="••••••••" />
      </div>
      <div id="errorMsg" class="hidden text-red-600 text-sm bg-red-50 rounded-lg px-3 py-2"></div>
      <button type="submit" class="w-full bg-emerald-700 text-white font-semibold py-2 rounded-lg hover:bg-emerald-800 transition">Se connecter</button>
    </form>
  </div>
  <script src="../js/api.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errEl = document.getElementById('errorMsg');
      const data = await login(email, password);
      if (data.error) { errEl.textContent = data.error; errEl.classList.remove('hidden'); return; }
      localStorage.setItem('token', data.token);
      localStorage.setItem('adminEmail', data.user.email);
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
