<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catalogue des Biens</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <nav class="bg-white shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between h-16 items-center">
      <a href="index.html" class="text-2xl font-bold text-emerald-700">🏠 Agence Immo</a>
      <div class="hidden md:flex space-x-8 text-sm font-medium">
        <a href="index.html" class="text-gray-600 hover:text-emerald-700">Accueil</a>
        <a href="biens.html" class="text-emerald-700">Biens</a>
        <a href="bien.html" class="text-gray-600 hover:text-emerald-700">Fiche bien</a>
        <a href="admin/index.html" class="text-gray-600 hover:text-emerald-700">Espace Admin</a>
      </div>
    </div>
  </nav>

  <!-- Filtres -->
  <section class="max-w-7xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-extrabold text-gray-900 mb-6">Trouvez votre bien</h1>
    <div class="bg-white rounded-xl shadow-sm p-4 mb-8 grid grid-cols-1 md:grid-cols-5 gap-4">
      <input id="filterSearch" type="text" placeholder="Recherche (titre, quartier…)" class="border rounded-lg px-4 py-2 text-sm col-span-1 md:col-span-2" />
      <select id="filterType" class="border rounded-lg px-4 py-2 text-sm">
        <option value="">Tous types</option>
        <option>Maison</option><option>Appartement</option><option>Immeuble</option><option>Terrain</option><option>Bureau</option>
      </select>
      <select id="filterStatut" class="border rounded-lg px-4 py-2 text-sm">
        <option value="">Tous statuts</option>
        <option>Disponible</option><option>Loué</option><option>Vendu</option>
      </select>
      <button onclick="applyFilters()" class="bg-emerald-700 text-white rounded-lg px-4 py-2 text-sm font-medium hover:bg-emerald-800">Filtrer</button>
    </div>

    <!-- Résultats -->
    <div id="biensGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    </div>
    <div id="biensEmpty" class="hidden text-center text-gray-400 py-12">Aucun bien correspondant.</div>
  </section>

  <footer class="bg-gray-900 text-gray-400 py-8 text-center text-sm">
    <p>© 2026 Agence Immobilière</p>
  </footer>

  <script src="js/api.js"></script>
  <script>
    let allBiens = [];

    async function loadAll() {
      allBiens = await fetchBiens();
      render(allBiens);
    }

    function render(list) {
      const grid = document.getElementById('biensGrid');
      const empty = document.getElementById('biensEmpty');
      if (list.length === 0) { grid.classList.add('hidden'); empty.classList.remove('hidden'); return; }
      grid.classList.remove('hidden'); empty.classList.add('hidden');

      grid.innerHTML = list.map(b => `
        <a href="bien.html?id=${b.id}" class="bg-white rounded-xl shadow-sm overflow-hidden hover:shadow-md transition border">
          <div class="h-44 bg-gray-200 flex items-center justify-center text-gray-400">
            ${b.photos && b.photos.length ? `<img src="${API_BASE}${b.photos[0].url}" alt="${b.titre}" class="w-full h-full object-cover" />` : '📷'}
          </div>
          <div class="p-4">
            <h3 class="font-semibold text-gray-800">${b.titre}</h3>
            <p class="text-sm text-gray-500">${b.localite} ${b.quartier ? '· ' + b.quartier : ''}</p>
            <div class="mt-2 flex justify-between items-center">
              <span class="text-emerald-700 font-bold text-lg">${b.prix.toLocaleString()} ${b.devise || 'FCFA'}</span>
              <span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-1 rounded">${b.statut}</span>
            </div>
            <p class="text-xs text-gray-400 mt-1">${b.pieces} pièces · ${b.superficie_m2} m²</p>
          </div>
        </a>
      `).join('');
    }

    function applyFilters() {
      const search = document.getElementById('filterSearch').value.toLowerCase();
      const type = document.getElementById('filterType').value;
      const statut = document.getElementById('filterStatut').value;
      let filtered = allBiens;
      if (type) filtered = filtered.filter(b => b.type === type);
      if (statut) filtered = filtered.filter(b => b.statut === statut);
      if (search) filtered = filtered.filter(b => b.titre.toLowerCase().includes(search) || (b.localite||'').toLowerCase().includes(search) || (b.description||'').toLowerCase().includes(search));
      render(filtered);
    }

    document.getElementById('filterSearch')?.addEventListener('input', applyFilters);
    document.getElementById('filterType')?.addEventListener('change', applyFilters);
    document.getElementById('filterStatut')?.addEventListener('change', applyFilters);

    loadAll();
  </script>
</body>
</html>
